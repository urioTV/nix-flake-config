version = 1

[*]
# Force the ROCm backend onto GPU 0 (ROCm0). Applied globally to every model
# below so the server can never fall back to the CPU or a different GPU.
device = ROCm0

[ornith-1.5-35b-apex-mtp]
hf-repo = mudler/Ornith-1.5-35B-A3B-APEX-MTP-GGUF
hf-file = Ornith-1.5-35B-A3B-APEX-MTP-Compact.gguf
fit = on
ctx-size = 260000
cache-type-k = q8_0
cache-type-v = q8_0
batch-size = 4096
ubatch-size = 1024
jinja = true
reasoning = auto
reasoning-format = deepseek
tags = reasoning
parallel = 1
# Qwen3.8-27B-QAT (Q2_0, 8.76 GB) on RX 9070 XT (16 GB).
# At 260k tokens, q8_0 KV cache needs 8.4 GiB and causes VRAM OOM; q4_0
# keeps the KV cache at roughly 4.5 GiB while leaving all model layers on GPU.
[Qwen3.8-27B-QAT-Q2_0]
hf-repo = sdkyuan/qwen3.8-27B-qat-q2_0-gguf
hf-file = qwen38-27b-qat-q2_0.gguf
fit = off
ngl = all
ctx-size = 260000
cache-type-k = q4_0
cache-type-v = q4_0
batch-size = 2048
ubatch-size = 512
flash-attn = on
jinja = true
reasoning = auto
reasoning-format = auto
tags = reasoning
parallel = 1
