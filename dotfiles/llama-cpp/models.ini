version = 1

[*]
# Force the ROCm backend onto GPU 0 (ROCm0). Applied globally to every model
# below so the server can never fall back to the CPU or a different GPU.
device = ROCm0

[ornith-1.5-35b-apex-mtp]
hf-repo = mudler/Ornith-1.5-35B-A3B-APEX-MTP-GGUF
hf-file = Ornith-1.5-35B-A3B-APEX-MTP-Compact.gguf
fit = on
ctx-size = 260000
cache-type-k = q8_0
cache-type-v = q8_0
batch-size = 4096
ubatch-size = 1024
jinja = true
reasoning = auto
reasoning-format = deepseek
tags = reasoning
parallel = 1
